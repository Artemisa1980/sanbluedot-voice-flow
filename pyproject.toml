[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanbluedot-voiceflow"
version = "0.10.0"
description = "Personal local-first dictation engine for macOS and Windows"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
voiceflow = "sanbluedot_voiceflow.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
